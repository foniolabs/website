name: CI

# Runs on every PR (against any base branch) and on direct pushes to main.
# Vercel handles deploys via the git integration — this workflow is the merge
# gate: lint, type-check, build. Anything that breaks here fails the PR.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The public Sanity vars are intentionally inlined, not pulled from
    # secrets — they ship in the client bundle on production anyway. Keeping
    # them in plain env means a forked PR can run CI without secret access.
    env:
      NEXT_PUBLIC_SANITY_PROJECT_ID: 8smu0dlv
      NEXT_PUBLIC_SANITY_DATASET: production
      NEXT_PUBLIC_SANITY_API_VERSION: "2025-05-31"

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.20.0"
          cache: "npm"

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
